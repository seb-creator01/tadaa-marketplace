    <style>
        /* ============================================
           PREMIUM OVERRIDES & ENHANCEMENTS
           ============================================ */
        
        /* ---- Install Banner ---- */
        #installBanner {
            display: none;
            background: linear-gradient(135deg, #FFD700 0%, #F5A623 100%);
            padding: 14px 24px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 24px rgba(255, 215, 0, 0.3);
        }
        #installBanner.show {
            display: flex !important;
            animation: slideDown 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #installBanner button {
            border: none;
            padding: 10px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', -apple-system, sans-serif;
            transition: all 0.3s ease;
        }
        .btn-install {
            background: #000;
            color: #FFD700;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        .btn-install:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
        }
        .btn-cancel {
            background: rgba(255, 255, 255, 0.3);
            color: #000;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 0, 0, 0.1) !important;
        }
        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        /* ---- Splash Screen ---- */
        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000000;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #splashScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .splash-container {
            text-align: center;
            padding: 20px;
            animation: splashPulse 2.5s ease-in-out infinite;
        }
        .splash-brand {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 64px;
            font-weight: 700;
            color: #FFD700;
            letter-spacing: 4px;
            display: block;
            text-shadow: 0 0 60px rgba(255, 215, 0, 0.15);
        }
        .splash-exclamation { color: #FFFFFF; }
        .splash-loader {
            width: 200px;
            height: 3px;
            background: rgba(255, 215, 0, 0.15);
            border-radius: 10px;
            margin: 28px auto 18px;
            overflow: hidden;
            position: relative;
        }
        .splash-loader-bar {
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, #FFD700, #F5A623);
            border-radius: 10px;
            animation: splashLoader 1.4s ease-in-out infinite;
            position: absolute;
            top: 0;
            left: 0;
        }
        .splash-subtitle {
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 13px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin: 0;
        }
        
        /* ---- Track Order Section ---- */
        .track-section {
            background: var(--bg-card);
            border-radius: 20px;
            margin: 24px auto;
            max-width: 1200px;
            padding: 40px 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            transition: box-shadow 0.3s ease;
        }
        .track-section:hover {
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.1);
        }
        .track-section .track-container {
            max-width: 560px;
            margin: 0 auto;
            text-align: center;
        }
        .track-section .track-icon {
            font-size: 44px;
            margin-bottom: 12px;
            display: block;
        }
        .track-section .track-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 30px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0 0 6px;
        }
        .track-section .track-subtitle {
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-size: 16px;
            font-weight: 400;
        }
        .track-section .track-input-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .track-section .track-input {
            flex: 1;
            min-width: 200px;
            max-width: 360px;
            padding: 14px 20px;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            font-size: 16px;
            background: var(--bg-input);
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Inter', -apple-system, sans-serif;
        }
        .track-section .track-input:focus {
            border-color: #FFD700;
            box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.15);
        }
        .track-section .track-btn {
            background: linear-gradient(135deg, #FFD700 0%, #F5A623 100%);
            color: #000;
            border: none;
            padding: 14px 36px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(255, 215, 0, 0.3);
            font-family: 'Inter', -apple-system, sans-serif;
        }
        .track-section .track-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(255, 215, 0, 0.4);
        }
        .track-section .track-btn:active {
            transform: scale(0.97);
        }
        .track-section .track-btn-outline {
            background: transparent;
            color: var(--text-primary);
            border: 2px solid var(--border-color);
            padding: 14px 36px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', -apple-system, sans-serif;
        }
        .track-section .track-btn-outline:hover {
            background: var(--border-color);
            transform: translateY(-2px);
        }
        .track-section .track-divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 20px 0;
        }
        .track-section .track-divider-line {
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }
        .track-section .track-divider-text {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .track-section .track-error {
            color: #EF4444;
            margin-top: 12px;
            display: none;
            font-size: 14px;
            font-weight: 500;
        }
        
        /* ---- WhatsApp Floating Button ---- */
        .whatsapp-float {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        body.cart-open .whatsapp-float {
            transform: scale(0) rotate(90deg);
            opacity: 0;
            pointer-events: none;
        }
        .whatsapp-float .whatsapp-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #25D366 0%, #1da851 100%);
            color: #fff;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            box-shadow: 0 6px 28px rgba(37, 211, 102, 0.4);
            text-decoration: none;
            transition: all 0.3s ease;
            animation: whatsappPulse 2.5s ease-in-out infinite;
        }
        .whatsapp-float .whatsapp-btn:hover {
            transform: scale(1.1) translateY(-4px);
            box-shadow: 0 10px 40px rgba(37, 211, 102, 0.5);
        }
        .whatsapp-float .whatsapp-tooltip {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            color: #fff;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-family: 'Inter', -apple-system, sans-serif;
            font-weight: 500;
            opacity: 0;
            transform: translateX(12px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        .whatsapp-float:hover .whatsapp-tooltip {
            opacity: 1;
            transform: translateX(0) scale(1);
        }
        .whatsapp-float .whatsapp-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #EF4444;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 50px;
            font-family: 'Inter', -apple-system, sans-serif;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3);
        }
        
        /* ---- Responsive Enhancements ---- */
        @media (max-width: 768px) {
            .splash-brand { font-size: 44px; }
            .splash-loader { width: 160px; }
            .splash-subtitle { font-size: 11px; letter-spacing: 4px; }
            .track-section { padding: 28px 16px; margin: 16px auto; }
            .track-section .track-title { font-size: 24px; }
        }
        @media (max-width: 480px) {
            .splash-brand { font-size: 34px; letter-spacing: 2px; }
            .splash-loader { width: 140px; }
            .splash-subtitle { font-size: 10px; letter-spacing: 3px; }
            .track-section { padding: 20px 12px; border-radius: 16px; }
            .track-section .track-title { font-size: 20px; }
            .track-section .track-input { min-width: 100%; max-width: 100%; }
            .track-section .track-btn { width: 100%; justify-content: center; }
            .track-section .track-btn-outline { width: 100%; justify-content: center; }
            .whatsapp-float { bottom: 16px; right: 16px; }
            .whatsapp-float .whatsapp-btn { width: 54px; height: 54px; }
            .whatsapp-float .whatsapp-btn svg { width: 28px; height: 28px; }
            #installBanner { padding: 12px 16px; }
            #installBanner button { padding: 8px 16px; font-size: 12px; }
        }
        
        /* ---- Scrollbar Styling ---- */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-input);
        }
        ::-webkit-scrollbar-thumb {
            background: #FFD700;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #E6C200;
        }
        
        /* ---- Selection Color ---- */
        ::selection {
            background: #FFD700;
            color: #000;
        }
    </style>
</head>
<body>

    <script>
        console.log('🚀 Tadaa! PWA loaded');
        
        let deferredPrompt = null;
        let installBannerShown = false;
        
        const banner = document.getElementById('installBanner');
        const installBtn = document.getElementById('installBtn');
        const cancelBtn = document.getElementById('cancelInstallBtn');
        const installSubtext = document.getElementById('installSubtext');
        
        // ============================================
        // DETECT BROWSER
        // ============================================
        function getBrowserInfo() {
            const ua = navigator.userAgent;
            const isSamsung = ua.includes('Samsung') || ua.includes('SM-');
            const isSafari = /^((?!chrome|android).)*safari/i.test(ua);
            const isChrome = /chrome/i.test(ua) && !ua.includes('Samsung');
            const isIOS = /iphone|ipad|ipod/i.test(ua);
            const isAndroid = /android/i.test(ua);
            
            return { isSamsung, isSafari, isChrome, isIOS, isAndroid };
        }
        
        // ============================================
        // CHECK IF APP IS INSTALLED
        // ============================================
        function isAppInstalled() {
            if (window.matchMedia('(display-mode: standalone)').matches) {
                console.log('✅ App is already installed (standalone mode)');
                return true;
            }
            if (window.navigator.standalone) {
                console.log('✅ App is already installed (iOS)');
                return true;
            }
            return false;
        }
        
        // ============================================
        // SHOW / HIDE BANNER
        // ============================================
        function showBanner() {
            if (!banner) return;
            if (isAppInstalled()) { banner.classList.remove('show'); return; }
            if (sessionStorage.getItem('installDeclined') === 'true') { banner.classList.remove('show'); return; }
            
            const browser = getBrowserInfo();
            
            // For Chrome Android - use deferredPrompt
            if (browser.isChrome && browser.isAndroid) {
                if (!deferredPrompt) {
                    console.log('⏳ No deferredPrompt, banner hidden');
                    banner.classList.remove('show');
                    return;
                }
            }
            
            console.log('📲 Showing install banner');
            banner.classList.add('show');
            installBannerShown = true;
        }
        
        function hideBanner() {
            if (banner) banner.classList.remove('show');
        }
        
        // ============================================
        // SHOW INSTALL INSTRUCTIONS
        // ============================================
        function showInstallInstructions() {
            const browser = getBrowserInfo();
            
            const instructions = document.createElement('div');
            instructions.id = 'installInstructions';
            instructions.style.cssText = `
                position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0,0,0,0.85);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                z-index: 10000;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
                animation: fadeIn 0.3s ease;
            `;
            instructions.innerHTML = `
                <div style="background: #fff; border-radius: 28px; max-width: 400px; width: 100%; padding: 36px 32px; text-align: center; position: relative; box-shadow: 0 24px 80px rgba(0,0,0,0.3);">
                    <button onclick="this.closest('#installInstructions').remove()" style="position: absolute; top: 12px; right: 16px; background: none; border: none; font-size: 24px; cursor: pointer; color: #999; transition: color 0.3s;" onmouseover="this.style.color='#000'" onmouseout="this.style.color='#999'">✕</button>
                    <div style="font-size: 52px; margin-bottom: 12px;">📱</div>
                    <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 26px; color: #000; margin: 0 0 6px;">Install Tadaa!</h2>
                    <p style="color: #666; margin-bottom: 24px; line-height: 1.6; font-family: 'Inter', sans-serif; font-size: 15px;">Get the full app experience on your device</p>
                    <div style="text-align: left; background: #f5f5f5; padding: 20px; border-radius: 16px; margin-bottom: 24px;">
                        <p style="font-weight: 600; margin: 0 0 10px; color: #000; font-family: 'Inter', sans-serif; font-size: 14px;">${browser.isSafari || browser.isIOS ? '📲 On iPhone/iPad:' : '📲 On Samsung Internet:'}</p>
                        <ol style="margin: 0; padding-left: 20px; color: #444; line-height: 2.2; font-family: 'Inter', sans-serif; font-size: 14px;">
                            ${browser.isSafari || browser.isIOS ? `
                                <li>Tap the <strong>Share</strong> icon <span style="font-size:18px;">⬆️</span></li>
                                <li>Scroll down and tap <strong>"Add to Home Screen"</strong></li>
                                <li>Tap <strong>"Add"</strong> in the top right</li>
                            ` : `
                                <li>Tap the <strong>☰</strong> menu icon</li>
                                <li>Select <strong>"Add to Home Screen"</strong></li>
                                <li>Tap <strong>"Add"</strong> to install</li>
                            `}
                        </ol>
                    </div>
                    <button onclick="this.closest('#installInstructions').remove()" style="background: linear-gradient(135deg, #FFD700 0%, #F5A623 100%); color: #000; border: none; padding: 14px 40px; border-radius: 14px; font-weight: 600; font-size: 16px; cursor: pointer; font-family: 'Inter', sans-serif; box-shadow: 0 4px 20px rgba(255, 215, 0, 0.3); transition: all 0.3s;" onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 8px 32px rgba(255,215,0,0.4)'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 20px rgba(255,215,0,0.3)'">Got it!</button>
                </div>
            `;
            document.body.appendChild(instructions);
        }
        
        // ============================================
        // CHECK AND SHOW CORRECT BANNER
        // ============================================
        function checkAndShowInstallBanner() {
            const browser = getBrowserInfo();
            
            // If already installed, hide banner
            if (isAppInstalled()) {
                banner.classList.remove('show');
                return;
            }
            
            // For Chrome Android - use beforeinstallprompt
            if (browser.isChrome && browser.isAndroid) {
                if (deferredPrompt) {
                    banner.classList.add('show');
                    if (installBtn) installBtn.textContent = '📲 Install';
                    if (installSubtext) installSubtext.textContent = 'Get the full app experience';
                }
                return;
            }
            
            // For Samsung Internet and iPhone - show instructions
            if (browser.isSamsung || browser.isSafari || browser.isIOS) {
                banner.classList.add('show');
                if (installBtn) installBtn.textContent = '📱 Install App';
                if (installSubtext) installSubtext.textContent = 'Add to your home screen';
                return;
            }
        }
        
        // ============================================
        // INSTALL BUTTON
        // ============================================
        if (installBtn) {
            installBtn.addEventListener('click', function() {
                console.log('📲 Install button clicked');
                
                const browser = getBrowserInfo();
                
                if (isAppInstalled()) {
                    console.log('⏭️ Already installed');
                    hideBanner();
                    return;
                }
                
                // For Chrome Android - use native prompt
                if (browser.isChrome && browser.isAndroid) {
                    if (deferredPrompt) {
                        console.log('📲 Showing native install prompt');
                        deferredPrompt.prompt();
                        deferredPrompt.userChoice.then(function(result) {
                            if (result.outcome === 'accepted') {
                                console.log('✅ App installed successfully!');
                                hideBanner();
                                sessionStorage.removeItem('installDeclined');
                            } else {
                                console.log('❌ User declined');
                                hideBanner();
                                sessionStorage.setItem('installDeclined', 'true');
                            }
                            deferredPrompt = null;
                        });
                    } else {
                        console.log('❌ No deferredPrompt available');
                        hideBanner();
                        sessionStorage.setItem('installDeclined', 'true');
                    }
                } else {
                    // For Samsung/iPhone - show instructions
                    showInstallInstructions();
                }
            });
        }
        
        // ============================================
        // CANCEL BUTTON
        // ============================================
        if (cancelBtn) {
            cancelBtn.addEventListener('click', function() {
                console.log('❌ User cancelled');
                hideBanner();
                sessionStorage.setItem('installDeclined', 'true');
            });
        }
        
        // ============================================
        // CAPTURE INSTALL PROMPT - THIS IS KEY
        // ============================================
        window.addEventListener('beforeinstallprompt', function(e) {
            console.log('📲 beforeinstallprompt event FIRED!');
            e.preventDefault();
            deferredPrompt = e;
            console.log('✅ deferredPrompt saved');
            checkAndShowInstallBanner();
        });
        
        // ============================================
        // APP INSTALLED
        // ============================================
        window.addEventListener('appinstalled', function() {
            console.log('✅ App installed successfully!');
            hideBanner();
        });
        
        // ============================================
        // CHECK ON LOAD
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 DOM loaded');
            
            if (isAppInstalled()) {
                console.log('✅ App already installed - hiding banner');
                hideBanner();
                return;
            }
            
            console.log('🔍 Checking PWA status...');
            console.log('   - HTTPS:', window.location.protocol === 'https:' ? '✅' : '❌');
            console.log('   - Manifest:', document.querySelector('link[rel="manifest"]') ? '✅' : '❌');
            console.log('   - Service Worker:', 'serviceWorker' in navigator ? '✅' : '❌');
            
            // Show the correct banner based on browser
            setTimeout(function() {
                if (deferredPrompt) {
                    console.log('✅ deferredPrompt exists - showing banner');
                    checkAndShowInstallBanner();
                } else {
                    console.log('⏳ deferredPrompt not yet available');
                    // Try showing instructions for non-Chrome browsers
                    checkAndShowInstallBanner();
                    // Try again after 5 seconds
                    setTimeout(function() {
                        if (deferredPrompt) {
                            console.log('✅ deferredPrompt now exists - showing banner');
                            checkAndShowInstallBanner();
                        } else {
                            console.log('❌ deferredPrompt still not available');
                            // Try showing instructions for non-Chrome browsers again
                            checkAndShowInstallBanner();
                        }
                    }, 5000);
                }
            }, 2000);
        });
        
        // Check when user comes back
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                console.log('👁️ Page became visible');
                if (!isAppInstalled()) {
                    checkAndShowInstallBanner();
                }
            }
        });
        
        // ============================================
        // SERVICE WORKER WITH VERSIONING - FIXED PATH
        // ============================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js')
                    .then(function(reg) {
                        console.log('✅ Service Worker registered');
                    })
                    .catch(function(err) {
                        console.log('❌ Service Worker error:', err);
                    });
            });
        }

        // ============================================
        // TRACK ORDER FUNCTIONS
        // ============================================
        function findOrdersByPhone() {
            const input = document.getElementById('trackPhoneInput');
            const error = document.getElementById('trackError');
            const phone = input?.value?.trim();
            
            if (!phone) {
                if (error) {
                    error.textContent = 'Please enter your phone number';
                    error.style.display = 'block';
                }
                return;
            }
            
            // Basic validation - Nigerian phone number format
            const phoneClean = phone.replace(/\s/g, '');
            if (!phoneClean.match(/^0[789][01]\d{8}$|^\+234[789][01]\d{8}$/)) {
                if (error) {
                    error.textContent = 'Please enter a valid phone number (e.g., 08012345678)';
                    error.style.display = 'block';
                }
                return;
            }
            
            if (error) {
                error.style.display = 'none';
            }
            
            // Redirect to tracking page with phone number
            window.location.href = `./tracking.html?phone=${encodeURIComponent(phone)}`;
        }

        function trackByOrderId() {
            const input = document.getElementById('trackOrderInput');
            const error = document.getElementById('trackError');
            const orderId = input?.value?.trim();
            
            if (!orderId) {
                if (error) {
                    error.textContent = 'Please enter your Order ID';
                    error.style.display = 'block';
                }
                return;
            }
            
            // Basic validation - should start with TAD-
            if (!orderId.startsWith('TAD-')) {
                if (error) {
                    error.textContent = 'Please enter a valid Order ID (e.g., TAD-20260716-123456)';
                    error.style.display = 'block';
                }
                return;
            }
            
            if (error) {
                error.style.display = 'none';
            }
            
            // Redirect to tracking page with order ID
            window.location.href = `./tracking.html?order=${orderId}`;
        }

        // Allow Enter key to trigger tracking
        document.addEventListener('DOMContentLoaded', function() {
            const phoneInput = document.getElementById('trackPhoneInput');
            const orderInput = document.getElementById('trackOrderInput');
            
            if (phoneInput) {
                phoneInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        findOrdersByPhone();
                    }
                });
            }
            
            if (orderInput) {
                orderInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        trackByOrderId();
                    }
                });
            }
        });
        
        console.log('✅ Tadaa! PWA ready');
    </script>
</body>
</html>
