<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tadaa! - Premium Online Marketplace</title>
    
    <meta name="description" content="Shop premium products at Tadaa! - Your trusted online marketplace in Nigeria." />
    <link rel="canonical" href="https://seb-creator01.github.io/tadaa-marketplace/" />
    <meta property="og:title" content="Tadaa! - Premium Online Marketplace" />
    <meta property="og:description" content="Shop premium products at Tadaa!" />
    <meta property="og:image" content="https://seb-creator01.github.io/tadaa-marketplace/assets/images/og-image.jpg" />
    <meta property="og:url" content="https://seb-creator01.github.io/tadaa-marketplace/" />
    <meta property="og:type" content="website" />
    
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#FFD700" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tadaa!" />
    
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./assets/css/main.css" />
    
    <!-- ===== PREMIUM FONTS ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    
    <style>
        /* ============================================
           PREMIUM OVERRIDES & ENHANCEMENTS
           ============================================ */
        
        /* ---- Scroll Margin for Anchor Links ---- */
        #categories-section, #track-section, #wishlist-section {
            scroll-margin-top: 90px;
            scroll-margin-bottom: 90px;
        }
        
        /* ---- Install Banner (Premium Redesign) ---- */
        #installBanner {
            display: none;
            background: #0a0a0a;
            padding: 16px 24px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 215, 0, 0.15);
        }
        #installBanner.show {
            display: flex !important;
            animation: slideDown 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #installBanner .banner-icon svg {
            width: 32px;
            height: 32px;
            stroke: #FFD700;
            fill: none;
            stroke-width: 1.5;
        }
        #installBanner .banner-text {
            display: flex;
            flex-direction: column;
        }
        #installBanner .banner-text strong {
            color: #fff;
            font-family: 'Cormorant Garamond', serif;
            font-size: 18px;
            letter-spacing: 0.5px;
        }
        #installBanner .banner-text span {
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            font-family: 'Inter', sans-serif;
        }
        #installBanner button {
            border: none;
            padding: 10px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', -apple-system, sans-serif;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .btn-install {
            background: #FFD700;
            color: #000;
            box-shadow: 0 4px 16px rgba(255, 215, 0, 0.2);
        }
        .btn-install:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 24px rgba(255, 215, 0, 0.3);
        }
        .btn-cancel {
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }
        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        /* ============================================
           SPLASH SCREEN WITH SHOPPER
           ============================================ */
        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0a0a;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), 
                        visibility 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #splashScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .splash-container {
            text-align: center;
            padding: 20px;
            max-width: 400px;
            width: 100%;
        }
        
        /* ---- Logo ---- */
        .splash-brand {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 56px;
            font-weight: 700;
            color: #FFD400;
            letter-spacing: 2px;
            display: block;
            animation: splashPulse 3s ease-in-out infinite;
        }
        .splash-exclamation {
            color: #FFFFFF;
        }
        .splash-subtitle {
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 12px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin: 20px 0 0;
            opacity: 0.6;
        }
        @keyframes splashPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        /* ---- Loader with Shopper ---- */
        .splash-loader-wrapper {
            margin: 28px auto 0;
            width: 100%;
            max-width: 320px;
            position: relative;
            padding-top: 50px;
        }
        .splash-loader-track {
            position: relative;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: visible;
        }
        .splash-line-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #FFD400 0%, #F5A623 100%);
            border-radius: 10px;
            transition: width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
        }
        
        /* ---- Shopper Container ---- */
        .shopper-container {
            position: absolute;
            top: 50%;
            left: 0%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 52px;
            transition: left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2;
            pointer-events: none;
        }
        .shopper-svg {
            width: 100%;
            height: 100%;
            display: block;
            animation: shopperFloat 1.2s ease-in-out infinite;
        }
        
        /* ---- Shopper Walking Animation ---- */
        @keyframes shopperFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }
        .leg-left {
            animation: walkLegLeft 0.6s ease-in-out infinite;
            transform-origin: 26px 33px;
        }
        .leg-right {
            animation: walkLegRight 0.6s ease-in-out infinite;
            transform-origin: 34px 33px;
        }
        @keyframes walkLegLeft {
            0%, 100% { transform: rotate(-8deg); }
            50% { transform: rotate(12deg); }
        }
        @keyframes walkLegRight {
            0%, 100% { transform: rotate(8deg); }
            50% { transform: rotate(-12deg); }
        }
        .shopper-shadow {
            animation: shadowPulse 1.2s ease-in-out infinite;
        }
        @keyframes shadowPulse {
            0%, 100% { opacity: 0.2; rx: 14; ry: 2.5; }
            50% { opacity: 0.4; rx: 12; ry: 2; }
        }
        .shopper-body {
            animation: bodyBounce 1.2s ease-in-out infinite;
        }
        @keyframes bodyBounce {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-2px); }
        }
        
        /* ---- Responsive ---- */
        @media (max-width: 768px) {
            .splash-brand { font-size: 44px; }
            .splash-loader-wrapper { max-width: 260px; padding-top: 44px; }
            .shopper-container { width: 50px; height: 44px; }
            .splash-subtitle { font-size: 10px; letter-spacing: 4px; }
        }
        @media (max-width: 480px) {
            .splash-brand { font-size: 34px; }
            .splash-loader-wrapper { max-width: 200px; padding-top: 38px; }
            .shopper-container { width: 42px; height: 38px; }
            .splash-subtitle { font-size: 9px; letter-spacing: 3px; margin-top: 16px; }
        }
        
        /* ---- Track Order Section (Premium Refinement) ---- */
        #track-section {
            background: var(--bg-card);
            border-radius: 24px;
            margin: 32px auto 0;
            max-width: 1200px;
            padding: 48px 32px;
            border: 1px solid var(--border-color);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.04);
            transition: box-shadow 0.3s ease;
        }
        #track-section:hover {
            box-shadow: 0 16px 56px rgba(0, 0, 0, 0.08);
        }
        #track-section .track-container {
            max-width: 560px;
            margin: 0 auto;
            text-align: center;
        }
        #track-section .track-icon-wrap {
            background: rgba(255, 215, 0, 0.08);
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        #track-section .track-icon-wrap svg {
            width: 28px;
            height: 28px;
            stroke: #FFD700;
            fill: none;
            stroke-width: 2;
        }
        #track-section .track-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0 0 8px;
        }
        #track-section .track-subtitle {
            color: var(--text-secondary);
            margin-bottom: 28px;
            font-size: 15px;
            font-weight: 400;
        }
        #track-section .track-input-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        #track-section .track-input {
            flex: 1;
            min-width: 200px;
            max-width: 360px;
            padding: 16px 20px;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            font-size: 15px;
            background: var(--bg-input);
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Inter', -apple-system, sans-serif;
        }
        #track-section .track-input:focus {
            border-color: #FFD700;
            box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.1);
        }
        #track-section .track-btn {
            background: linear-gradient(135deg, #FFD700 0%, #F5A623 100%);
            color: #000;
            border: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 4px 16px rgba(255, 215, 0, 0.25);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #track-section .track-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(255, 215, 0, 0.35);
        }
        #track-section .track-btn:active {
            transform: scale(0.97);
        }
        #track-section .track-btn svg {
            width: 18px;
            height: 18px;
            stroke: #000;
            fill: none;
            stroke-width: 2.5;
        }
        #track-section .track-btn-outline {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 16px 32px;
            border-radius: 14px;
            font-weight: 500;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #track-section .track-btn-outline svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }
        #track-section .track-btn-outline:hover {
            background: var(--bg-input);
            border-color: var(--text-primary);
            transform: translateY(-2px);
        }
        #track-section .track-divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
        }
        #track-section .track-divider-line {
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }
        #track-section .track-divider-text {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        #track-section .track-error {
            color: #EF4444;
            margin-top: 16px;
            display: none;
            font-size: 14px;
            font-weight: 500;
            background: rgba(239, 68, 68, 0.05);
            padding: 10px 16px;
            border-radius: 8px;
        }
        
        /* ---- WhatsApp Floating Button (Refined) ---- */
        .whatsapp-float {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        body.cart-open .whatsapp-float {
            transform: scale(0) rotate(90deg);
            opacity: 0;
            pointer-events: none;
        }
        .whatsapp-float .whatsapp-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #25D366 0%, #1da851 100%);
            color: #fff;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            box-shadow: 0 8px 32px rgba(37, 211, 102, 0.3);
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            animation: whatsappPulse 2.5s ease-in-out infinite;
            position: relative;
        }
        .whatsapp-float .whatsapp-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 40px rgba(37, 211, 102, 0.4);
        }
        .whatsapp-float .whatsapp-tooltip {
            background: #0a0a0a;
            backdrop-filter: blur(12px);
            color: #fff;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-family: 'Inter', -apple-system, sans-serif;
            font-weight: 500;
            opacity: 0;
            transform: translateY(8px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .whatsapp-float:hover .whatsapp-tooltip {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .whatsapp-float .whatsapp-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #EF4444;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 50px;
            font-family: 'Inter', -apple-system, sans-serif;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3);
        }
        
        /* ============================================
           STICKY BOTTOM NAVIGATION
           ============================================ */
        #bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 2000;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: stretch;
            padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px));
            box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
            transition: background var(--transition-normal), transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        /* Hide bottom nav when cart is open */
        body.cart-open #bottom-nav {
            transform: translateY(100%);
        }
        #bottom-nav .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.2s ease, transform 0.2s ease;
            padding: 4px 0;
            text-decoration: none;
            position: relative;
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            font-weight: 500;
        }
        #bottom-nav .nav-item svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s ease;
        }
        #bottom-nav .nav-item span {
            line-height: 1;
        }
        #bottom-nav .nav-item:hover {
            color: var(--text-primary);
            transform: translateY(-1px);
        }
        #bottom-nav .nav-item:active {
            transform: scale(0.92);
        }
        #bottom-nav .nav-item.active {
            color: #FFD400;
        }
        #bottom-nav .nav-item.active svg {
            stroke: #FFD400;
            stroke-width: 2.5;
        }
        #bottom-nav .nav-item .cart-badge-nav {
            position: absolute;
            top: 0px;
            right: 50%;
            transform: translateX(calc(50% + 12px));
            background: #FFD400;
            color: #000;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 50px;
            min-width: 16px;
            text-align: center;
            display: none;
        }
        
        /* ---- Wishlist Section Placeholder ---- */
        #wishlist-section {
            display: none;
            min-height: 60vh;
            padding: 40px 20px;
            text-align: center;
            color: var(--text-secondary);
        }
        #wishlist-section.active {
            display: block;
        }
        
        /* ---- Responsive Enhancements ---- */
        @media (max-width: 768px) {
            #track-section { padding: 32px 20px; margin: 20px auto; border-radius: 20px; }
            #track-section .track-title { font-size: 26px; }
        }
        @media (max-width: 480px) {
            #track-section { padding: 24px 16px; border-radius: 16px; }
            #track-section .track-title { font-size: 22px; }
            #track-section .track-input { min-width: 100%; max-width: 100%; padding: 14px 16px; }
            #track-section .track-btn { width: 100%; justify-content: center; }
            #track-section .track-btn-outline { width: 100%; justify-content: center; }
            .whatsapp-float { bottom: 80px; right: 16px; }
            .whatsapp-float .whatsapp-btn { width: 48px; height: 48px; }
            .whatsapp-float .whatsapp-btn svg { width: 24px; height: 24px; }
            #installBanner { padding: 12px 16px; }
            #installBanner button { padding: 8px 16px; font-size: 12px; }
            #installBanner .banner-text strong { font-size: 15px; }
            #installBanner .banner-text span { font-size: 11px; }
            #bottom-nav .nav-item svg { width: 20px; height: 20px; }
            #bottom-nav .nav-item { font-size: 9px; }
        }
        
        /* ---- Scrollbar Styling ---- */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-input);
        }
        ::-webkit-scrollbar-thumb {
            background: #FFD700;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #E6C200;
        }
        
        /* ---- Selection Color ---- */
        ::selection {
            background: #FFD700;
            color: #000;
        }
    </style>
</head>
<body>
    
    <!-- ===== SPLASH SCREEN WITH SHOPPER ===== -->
    <div id="splashScreen">
        <div class="splash-container">
            <!-- Logo -->
            <div class="splash-logo">
                <span class="splash-brand">Tadaa<span class="splash-exclamation">!</span></span>
            </div>
            
            <!-- Loader with Shopper -->
            <div class="splash-loader-wrapper">
                <div class="splash-loader-track">
                    <!-- The shopper SVG that walks along the line -->
                    <div class="shopper-container" id="shopperContainer">
                        <svg class="shopper-svg" viewBox="0 0 60 50" xmlns="http://www.w3.org/2000/svg">
                            <!-- Shopper Body -->
                            <g class="shopper-body">
                                <!-- Head -->
                                <circle cx="30" cy="12" r="8" fill="#FFD400" stroke="#1a1a1a" stroke-width="1.5"/>
                                <!-- Hair -->
                                <ellipse cx="30" cy="8" rx="9" ry="4" fill="#1a1a1a" opacity="0.8"/>
                                <!-- Face -->
                                <circle cx="27" cy="11" r="1.5" fill="#1a1a1a"/>
                                <circle cx="33" cy="11" r="1.5" fill="#1a1a1a"/>
                                <path d="M27 15 Q30 17 33 15" stroke="#1a1a1a" stroke-width="1" fill="none"/>
                                <!-- Body -->
                                <rect x="22" y="19" width="16" height="14" rx="3" fill="#1a1a1a"/>
                                <!-- Arms -->
                                <line x1="22" y1="22" x2="16" y2="28" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
                                <line x1="38" y1="22" x2="44" y2="28" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
                                <!-- Legs -->
                                <line x1="26" y1="33" x2="24" y2="42" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
                                <line x1="34" y1="33" x2="36" y2="42" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
                                <!-- Feet -->
                                <ellipse cx="24" cy="43" rx="4" ry="2" fill="#FFD400"/>
                                <ellipse cx="36" cy="43" rx="4" ry="2" fill="#FFD400"/>
                                <!-- Shopping Bag -->
                                <rect x="10" y="24" width="8" height="10" rx="1.5" fill="#FFD400" stroke="#1a1a1a" stroke-width="1"/>
                                <!-- Bag Handle -->
                                <path d="M12 24 Q14 20 18 24" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
                                <!-- Bag Star/Dot details -->

    <script src="./assets/js/customer/app.js"></script>
    
    <script>
        console.log('🚀 Tadaa! PWA loaded');
        
        let deferredPrompt = null;
        let installBannerShown = false;
        
        const banner = document.getElementById('installBanner');
        const installBtn = document.getElementById('installBtn');
        const cancelBtn = document.getElementById('cancelInstallBtn');
        const installSubtext = document.getElementById('installSubtext');
        
        // ============================================
        // BOTTOM NAVIGATION LOGIC
        // ============================================
        function switchTab(tab) {
            // Update Active State
            document.querySelectorAll('#bottom-nav .nav-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`#bottom-nav .nav-item[data-tab="${tab}"]`)?.classList.add('active');
            
            // Hide/Show Sections
            document.getElementById('wishlist-section').classList.remove('active');
            
            if (tab === 'home') {
                document.getElementById('products-section').style.display = 'block';
                document.getElementById('categories-section').style.display = 'block';
                document.getElementById('track-section').style.display = 'block';
                document.getElementById('announcement-section').style.display = 'block';
                document.getElementById('hero-section').style.display = 'block';
                document.getElementById('main-header').style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else if (tab === 'categories') {
                document.getElementById('products-section').style.display = 'block';
                document.getElementById('categories-section').style.display = 'block';
                document.getElementById('track-section').style.display = 'none';
                document.getElementById('announcement-section').style.display = 'none';
                document.getElementById('hero-section').style.display = 'none';
                document.getElementById('main-header').style.display = 'none';
                document.getElementById('wishlist-section').classList.remove('active');
                document.getElementById('categories-section').scrollIntoView({ behavior: 'smooth' });
            } else if (tab === 'wishlist') {
                document.getElementById('products-section').style.display = 'none';
                document.getElementById('categories-section').style.display = 'none';
                document.getElementById('track-section').style.display = 'none';
                document.getElementById('announcement-section').style.display = 'none';
                document.getElementById('hero-section').style.display = 'none';
                document.getElementById('main-header').style.display = 'none';
                document.getElementById('wishlist-section').classList.add('active');
            } else if (tab === 'track') {
                document.getElementById('products-section').style.display = 'block';
                document.getElementById('categories-section').style.display = 'block';
                document.getElementById('track-section').style.display = 'block';
                document.getElementById('announcement-section').style.display = 'none';
                document.getElementById('hero-section').style.display = 'none';
                document.getElementById('main-header').style.display = 'none';
                document.getElementById('wishlist-section').classList.remove('active');
                document.getElementById('track-section').scrollIntoView({ behavior: 'smooth' });
            }
        }
        window.switchTab = switchTab;

        // Update Nav Cart Count
        function updateNavCartCount() {
            const navBadge = document.getElementById('navCartCount');
            const count = cart ? cart.reduce((sum, item) => sum + item.quantity, 0) : 0;
            if (navBadge) {
                navBadge.textContent = count;
                navBadge.style.display = count > 0 ? 'inline' : 'none';
            }
        }
        // Override the existing updateCartCount to also trigger the nav update
        const originalUpdateCartCount = window.updateCartCount || function(){};
        window.updateCartCount = function() {
            originalUpdateCartCount();
            updateNavCartCount();
        };

        // ============================================
        // DETECT BROWSER
        // ============================================
        function getBrowserInfo() {
            const ua = navigator.userAgent;
            const isSamsung = ua.includes('Samsung') || ua.includes('SM-');
            const isSafari = /^((?!chrome|android).)*safari/i.test(ua);
            const isChrome = /chrome/i.test(ua) && !ua.includes('Samsung');
            const isIOS = /iphone|ipad|ipod/i.test(ua);
            const isAndroid = /android/i.test(ua);
            
            return { isSamsung, isSafari, isChrome, isIOS, isAndroid };
        }
        
        // ============================================
        // CHECK IF APP IS INSTALLED
        // ============================================
        function isAppInstalled() {
            if (window.matchMedia('(display-mode: standalone)').matches) {
                console.log('✅ App is already installed (standalone mode)');
                return true;
            }
            if (window.navigator.standalone) {
                console.log('✅ App is already installed (iOS)');
                return true;
            }
            return false;
        }
        
        // ============================================
        // SHOW / HIDE BANNER
        // ============================================
        function showBanner() {
            if (!banner) return;
            if (isAppInstalled()) { banner.classList.remove('show'); return; }
            if (sessionStorage.getItem('installDeclined') === 'true') { banner.classList.remove('show'); return; }
            
            const browser = getBrowserInfo();
            
            // For Chrome Android - use deferredPrompt
            if (browser.isChrome && browser.isAndroid) {
                if (!deferredPrompt) {
                    console.log('⏳ No deferredPrompt, banner hidden');
                    banner.classList.remove('show');
                    return;
                }
            }
            
            console.log('📲 Showing install banner');
            banner.classList.add('show');
            installBannerShown = true;
        }
        
        function hideBanner() {
            if (banner) banner.classList.remove('show');
        }
        
        // ============================================
        // SHOW INSTALL INSTRUCTIONS
        // ============================================
        function showInstallInstructions() {
            const browser = getBrowserInfo();
            
            const instructions = document.createElement('div');
            instructions.id = 'installInstructions';
            instructions.style.cssText = `
                position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(10,10,10,0.92);
                backdrop-filter: blur(24px);
                -webkit-backdrop-filter: blur(24px);
                z-index: 10000;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
                animation: fadeIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            `;
            instructions.innerHTML = `
                <div style="background: #161616; border-radius: 28px; max-width: 400px; width: 100%; padding: 40px 32px; text-align: center; position: relative; border: 1px solid rgba(255,255,255,0.05);">
                    <button onclick="this.closest('#installInstructions').remove()" style="position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.05); border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; color: #999; transition: all 0.3s; display:flex; align-items:center; justify-content:center;" onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='rgba(255,255,255,0.05)'">
                        <svg width="16" height="16" viewBox="0 0 24 24" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                    <div style="display:inline-flex; background:rgba(255,215,0,0.1); padding:12px; border-radius:16px; margin-bottom:16px;">
                        <svg width="32" height="32" viewBox="0 0 24 24" stroke="#FFD700" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" /><polyline points="10 9 9 9 8 9" /></svg>
                    </div>
                    <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 28px; color: #fff; margin: 0 0 8px;">Install Tadaa!</h2>
                    <p style="color: rgba(255,255,255,0.6); margin-bottom: 28px; line-height: 1.6; font-family: 'Inter', sans-serif; font-size: 15px;">Get the full app experience on your device</p>
                    <div style="text-align: left; background: rgba(255,255,255,0.03); padding: 20px; border-radius: 16px; margin-bottom: 28px; border: 1px solid rgba(255,255,255,0.05);">
                        <p style="font-weight: 600; margin: 0 0 12px; color: #FFD700; font-family: 'Inter', sans-serif; font-size: 13px; letter-spacing: 0.5px;">${browser.isSafari || browser.isIOS ? '📱 On iPhone/iPad:' : '📱 On Samsung Internet:'}</p>
                        <ol style="margin: 0; padding-left: 20px; color: rgba(255,255,255,0.7); line-height: 2.2; font-family: 'Inter', sans-serif; font-size: 14px;">
                            ${browser.isSafari || browser.isIOS ? `
                                <li>Tap the <strong style="color:#fff;">Share</strong> icon <span style="display:inline-block; margin:0 4px; transform:translateY(2px);">⬆️</span></li>
                                <li>Scroll down and tap <strong style="color:#fff;">"Add to Home Screen"</strong></li>
                                <li>Tap <strong style="color:#fff;">"Add"</strong> in the top right</li>
                            ` : `
                                <li>Tap the <strong style="color:#fff;">☰</strong> menu icon</li>
                                <li>Select <strong style="color:#fff;">"Add to Home Screen"</strong></li>
                                <li>Tap <strong style="color:#fff;">"Add"</strong> to install</li>
                            `}
                        </ol>
                    </div>
                    <button onclick="this.closest('#installInstructions').remove()" style="background: #FFD700; color: #000; border: none; padding: 14px 40px; border-radius: 14px; font-weight: 600; font-size: 16px; cursor: pointer; font-family: 'Inter', sans-serif; box-shadow: 0 4px 20px rgba(255, 215, 0, 0.2); transition: all 0.3s; width:100%;" onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 8px 32px rgba(255,215,0,0.3)'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 20px rgba(255,215,0,0.2)'">Got it</button>
                </div>
            `;
            document.body.appendChild(instructions);
        }
        
        // ============================================
        // CHECK AND SHOW CORRECT BANNER
        // ============================================
        function checkAndShowInstallBanner() {
            const browser = getBrowserInfo();
            
            // If already installed, hide banner
            if (isAppInstalled()) {
                banner.classList.remove('show');
                return;
            }
            
            // For Chrome Android - use beforeinstallprompt
            if (browser.isChrome && browser.isAndroid) {
                if (deferredPrompt) {
                    banner.classList.add('show');
                    if (installBtn) installBtn.textContent = 'Install';
                    if (installSubtext) installSubtext.textContent = 'Get the full app experience';
                }
                return;
            }
            
            // For Samsung Internet and iPhone - show instructions
            if (browser.isSamsung || browser.isSafari || browser.isIOS) {
                banner.classList.add('show');
                if (installBtn) installBtn.textContent = 'Install App';
                if (installSubtext) installSubtext.textContent = 'Add to your home screen';
                return;
            }
        }
        
        // ============================================
        // INSTALL BUTTON
        // ============================================
        if (installBtn) {
            installBtn.addEventListener('click', function() {
                console.log('📲 Install button clicked');
                
                const browser = getBrowserInfo();
                
                if (isAppInstalled()) {
                    console.log('⏭️ Already installed');
                    hideBanner();
                    return;
                }
                
                // For Chrome Android - use native prompt
                if (browser.isChrome && browser.isAndroid) {
                    if (deferredPrompt) {
                        console.log('📲 Showing native install prompt');
                        deferredPrompt.prompt();
                        deferredPrompt.userChoice.then(function(result) {
                            if (result.outcome === 'accepted') {
                                console.log('✅ App installed successfully!');
                                hideBanner();
                                sessionStorage.removeItem('installDeclined');
                            } else {
                                console.log('❌ User declined');
                                hideBanner();
                                sessionStorage.setItem('installDeclined', 'true');
                            }
                            deferredPrompt = null;
                        });
                    } else {
                        console.log('❌ No deferredPrompt available');
                        hideBanner();
                        sessionStorage.setItem('installDeclined', 'true');
                    }
                } else {
                    // For Samsung/iPhone - show instructions
                    showInstallInstructions();
                }
            });
        }
        
        // ============================================
        // CANCEL BUTTON
        // ============================================
        if (cancelBtn) {
            cancelBtn.addEventListener('click', function() {
                console.log('❌ User cancelled');
                hideBanner();
                sessionStorage.setItem('installDeclined', 'true');
            });
        }
        
        // ============================================
        // CAPTURE INSTALL PROMPT - THIS IS KEY
        // ============================================
        window.addEventListener('beforeinstallprompt', function(e) {
            console.log('📲 beforeinstallprompt event FIRED!');
            e.preventDefault();
            deferredPrompt = e;
            console.log('✅ deferredPrompt saved');
            checkAndShowInstallBanner();
        });
        
        // ============================================
        // APP INSTALLED
        // ============================================
        window.addEventListener('appinstalled', function() {
            console.log('✅ App installed successfully!');
            hideBanner();
        });
        
        // ============================================
        // CHECK ON LOAD
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 DOM loaded');
            
            if (isAppInstalled()) {
                console.log('✅ App already installed - hiding banner');
                hideBanner();
                return;
            }
            
            console.log('🔍 Checking PWA status...');
            console.log('   - HTTPS:', window.location.protocol === 'https:' ? '✅' : '❌');
            console.log('   - Manifest:', document.querySelector('link[rel="manifest"]') ? '✅' : '❌');
            console.log('   - Service Worker:', 'serviceWorker' in navigator ? '✅' : '❌');
            
            // Show the correct banner based on browser
            setTimeout(function() {
                if (deferredPrompt) {
                    console.log('✅ deferredPrompt exists - showing banner');
                    checkAndShowInstallBanner();
                } else {
                    console.log('⏳ deferredPrompt not yet available');
                    // Try showing instructions for non-Chrome browsers
                    checkAndShowInstallBanner();
                    // Try again after 5 seconds
                    setTimeout(function() {
                        if (deferredPrompt) {
                            console.log('✅ deferredPrompt now exists - showing banner');
                            checkAndShowInstallBanner();
                        } else {
                            console.log('❌ deferredPrompt still not available');
                            // Try showing instructions for non-Chrome browsers again
                            checkAndShowInstallBanner();
                        }
                    }, 5000);
                }
            }, 2000);
        });
        
        // Check when user comes back
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                console.log('👁️ Page became visible');
                if (!isAppInstalled()) {
                    checkAndShowInstallBanner();
                }
            }
        });
        
        // ============================================
        // SERVICE WORKER WITH VERSIONING - FIXED PATH
        // ============================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js')
                    .then(function(reg) {
                        console.log('✅ Service Worker registered');
                    })
                    .catch(function(err) {
                        console.log('❌ Service Worker error:', err);
                    });
            });
        }

        // ============================================
        // TRACK ORDER FUNCTIONS
        // ============================================
        function findOrdersByPhone() {
            const input = document.getElementById('trackPhoneInput');
            const error = document.getElementById('trackError');
            const phone = input?.value?.trim();
            
            if (!phone) {
                if (error) {
                    error.textContent = 'Please enter your phone number';
                    error.style.display = 'block';
                }
                return;
            }
            
            // Basic validation - Nigerian phone number format
            const phoneClean = phone.replace(/\s/g, '');
            if (!phoneClean.match(/^0[789][01]\d{8}$|^\+234[789][01]\d{8}$/)) {
                if (error) {
                    error.textContent = 'Please enter a valid phone number (e.g., 08012345678)';
                    error.style.display = 'block';
                }
                return;
            }
            
            if (error) {
                error.style.display = 'none';
            }
            
            // Redirect to tracking page with phone number
            window.location.href = `./tracking.html?phone=${encodeURIComponent(phone)}`;
        }

        function trackByOrderId() {
            const input = document.getElementById('trackOrderInput');
            const error = document.getElementById('trackError');
            const orderId = input?.value?.trim();
            
            if (!orderId) {
                if (error) {
                    error.textContent = 'Please enter your Order ID';
                    error.style.display = 'block';
                }
                return;
            }
            
            // Basic validation - should start with TAD-
            if (!orderId.startsWith('TAD-')) {
                if (error) {
                    error.textContent = 'Please enter a valid Order ID (e.g., TAD-20260716-123456)';
                    error.style.display = 'block';
                }
                return;
            }
            
            if (error) {
                error.style.display = 'none';
            }
            
            // Redirect to tracking page with order ID
            window.location.href = `./tracking.html?order=${orderId}`;
        }

        // Allow Enter key to trigger tracking
        document.addEventListener('DOMContentLoaded', function() {
            const phoneInput = document.getElementById('trackPhoneInput');
            const orderInput = document.getElementById('trackOrderInput');
            
            if (phoneInput) {
                phoneInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        findOrdersByPhone();
                    }
                });
            }
            
            if (orderInput) {
                orderInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        trackByOrderId();
                    }
                });
            }
        });
        
        console.log('✅ Tadaa! PWA ready');
    </script>
</body>
</html>
